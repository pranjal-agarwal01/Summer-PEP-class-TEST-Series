<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }

    body{
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }

    .card{
      width: 240px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      overflow: hidden;
      position: relative;
    }

    .sale-badge{
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e11d48;        
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
    }

    .img-wrap{
      padding: 18px 16px 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .img-wrap img{
      width: 185px;
      height: 185px;
      object-fit: contain;
      display: block;
    }

    .content{
      padding: 8px 16px 14px;
    }

    .title{
      font-size: 12px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .desc{
      font-size: 9.5px;
      color: #666;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .price{
      font-size: 12px;
      font-weight: 700;
      color: #111;
      margin-bottom: 10px;
    }

    .btn-row{
      display: flex;
      gap: 10px;
    }

    .btn{
      flex: 1;
      border: none;
      padding: 7px 0;
      font-size: 9.5px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-cart{
      background: #e5e5e5;
      color: #222;
      font-weight: 600;
    }

    .btn-buy{
      background: #111;
      color: #fff;
      font-weight: 600;
    }

    .btn:active{ transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="card">
    <div class="sale-badge">Sale</div>

    <div class="img-wrap">
      <img src="image.png"
           alt="Headphones">
    </div>

    <div class="content">
      <div class="title">Wireless Headphones</div>
      <div class="desc">High quality wireless headphones with noise cancellation.</div>
      <div class="price">₹2,999</div>

      <div class="btn-row">
        <button class="btn btn-cart">Add to Cart</button>
        <button class="btn btn-buy">Buy Now</button>
      </div>
    </div>
  </div>

</body>
</html>
