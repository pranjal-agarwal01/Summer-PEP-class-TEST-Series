<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <img src="pranjal.png" alt="Pranjal profile" class="profile-img">

    <h2 class="name">Pranjal Agarwal</h2>


    <p class="bio">
      B.Tech CSE student passionate about software development, AI projects,
      and building practical tech solutions.
    </p>

    <div class="info">
      <div>
        <h3>18</h3>
        <p>Posts</p>
      </div>
      <div>
        <h3>8K+</h3>
        <p>Followers</p>
      </div>
      <div>
        <h3>210</h3>
        <p>Following</p>
      </div>
    </div>

    <button class="follow-btn">Follow</button>
  </div>

</body>
</html>
